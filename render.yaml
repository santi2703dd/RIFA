services:
  - type: web
    name: rifa-extraordinaria
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_CLAVE
        sync: false
      - key: SESSION_SECRET
        sync: false
